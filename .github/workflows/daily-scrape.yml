name: Actualización Diaria de Precios Perú

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
  # Los horarios automáticos (3 con alerta Telegram + 5 refrescos web) se disparan
  # puntualmente vía cron-job.org usando workflow_dispatch (inputs.notify = true/false)
  # para evitar el retraso de 40-75 min de la cola schedule gratuita de GitHub Actions.
  workflow_dispatch:
    inputs:
      quick:
        description: 'Modo rápido (1 consulta por categoría)'
        required: false
        default: 'false'
        type: boolean
      notify:
        description: 'Enviar resumen de ofertas a Telegram'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-price-scrape'
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: npm ci

      - name: Ejecutar actualización de precios en tiendas de Perú
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            npm run scrape:quick
          else
            npm run scrape
          fi

      - name: Guardar historial diario en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "ChapaAlToque PE Bot"
          git config user.email "actions@github.com"
          git add data/ public/data/
          if git diff --staged --quiet; then
            echo "Sin cambios en precios hoy."
          else
            DATE_PE=$(TZ="America/Lima" date +"%Y-%m-%d %H:%M")
            git commit -m "chore(prices): actualización diaria Perú (${DATE_PE} PET) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Enviar alertas de ofertas a Telegram (@Chapaaltoque_pe_bot)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.notify != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://abelramosch.github.io/chapaaltoque/
        run: node scraper/notify.js

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy-pages:
    needs: scrape-and-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
